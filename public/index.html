<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cuisine Africaine</title>
    <meta name="description" content="Planifiez les repas, gérez le stock, la liste de marché et les recettes de votre famille." />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="theme-color" content="#C2461A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A120D" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuisine" />
    <meta name="application-name" content="Cuisine Africaine" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Écran de démarrage affiché avant le chargement de React */
      html, body { background: #FBF5EC; }
      @media (prefers-color-scheme: dark) { html, body { background: #1A120D; } }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, sans-serif; color: #A9370F;
      }
      #boot img { width: 88px; height: 88px; animation: boot 1.6s ease-in-out infinite; }
      #boot span { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
      @keyframes boot { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    </style>
  </head>
  <body>
    <noscript>Activez JavaScript pour utiliser Cuisine Africaine.</noscript>
    <div id="root">
      <div id="boot">
        <img src="%PUBLIC_URL%/logo.svg" alt="" />
        <span>Cuisine Africaine</span>
      </div>
    </div>
  </body>
</html>
