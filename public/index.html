<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Libiyo – Le carnet de cuisine de la famille africaine</title>
    <meta name="description" content="Libiyo, le carnet de cuisine de la famille : planifiez les repas africains de votre famille, menus de la semaine, liste de marché automatique, stock, recettes (ndolé, poulet DG, eru, mafé…) et assistant IA. Gratuit." />
    <link rel="canonical" href="https://libiyo.web.app/" />

    <!-- Aperçus de lien (WhatsApp, Facebook, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Libiyo" />
    <meta property="og:url" content="https://libiyo.web.app/" />
    <meta property="og:title" content="Libiyo – Le carnet de cuisine de la famille africaine" />
    <meta property="og:description" content="Menus de la semaine, liste de marché, stock et recettes africaines pour toute la famille." />
    <meta property="og:image" content="https://libiyo.web.app/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Libiyo – Le carnet de cuisine de la famille africaine" />
    <meta name="twitter:description" content="Menus de la semaine, liste de marché, stock et recettes africaines pour toute la famille." />
    <meta name="twitter:image" content="https://libiyo.web.app/logo512.png" />

    <!-- Données structurées pour Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Libiyo",
        "alternateName": ["Libiyo — Le carnet de cuisine de la famille", "Cuisine Africaine App"],
        "url": "https://libiyo.web.app/",
        "inLanguage": "fr",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "Planification des repas africains en famille : menus de la semaine, liste de marché, stock, recettes et assistant IA.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="theme-color" content="#C2461A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A120D" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Libiyo" />
    <meta name="application-name" content="Libiyo" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Écran de démarrage affiché avant le chargement de React */
      html, body { background: #FBF5EC; }
      @media (prefers-color-scheme: dark) { html, body { background: #1A120D; } }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, sans-serif; color: #A9370F;
      }
      #boot img { width: 88px; height: 88px; animation: boot 1.6s ease-in-out infinite; }
      #boot span { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
      @keyframes boot { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    </style>
  </head>
  <body>
    <noscript>Libiyo, le carnet de cuisine de la famille : planifiez les repas africains de votre famille, la liste de marché et le stock. Activez JavaScript pour utiliser l'application.</noscript>
    <div id="root">
      <div id="boot">
        <img src="%PUBLIC_URL%/logo.svg" alt="" />
        <span>Libiyo</span>
      </div>
    </div>
  </body>
</html>
